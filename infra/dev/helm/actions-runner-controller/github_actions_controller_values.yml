# Non-secret values for GitHub's official gha-runner-scale-set-controller chart.
# The namespace is supplied by the repeatable Helm command in ../Makefile.
replicaCount: 1

serviceAccount:
  create: true
  name: arc-controller

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

flags:
  logLevel: info
  logFormat: json
